name: Glass | First-Time Function Setup

on:
  workflow_call:

env:
  GOPRIVATE: github.com/obscurelyme/*

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure Git for private modules
        run: git config --global url."https://${{ secrets.GLASS_GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Test
        run: make test

      - name: Package
        run: make package

      - name: Upload function artifact
        uses: actions/upload-artifact@v4
        with:
          name: golang-lambda-first-time
          path: bootstrap.zip
          if-no-files-found: error

  upload:
    needs: package
    permissions:
      id-token: write
      contents: read
    uses: obscurelyme/glass/.github/workflows/deploy.yaml@v0.1.0
    with:
      role-to-assume: ${{ secrets.OIDC_IAM_ROLE }}
      aws-region: us-east-1
      deployment-environment: default
      artifact-name: golang-lambda-first-time
      glass-command: >-
        lambda upload --function ${{ github.event.repository.name }}
        --binary dist/bootstrap.zip --region us-east-1 --upload-only
    secrets:
      GLASS_TOKEN: ${{ secrets.GLASS_GH_PAT }}
