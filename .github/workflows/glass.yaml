name: Glass | Deployment Workflow

on:
  workflow_call:
    inputs:
      stack_action:
        description: Deployment action for the CloudFormation stack
        required: true
        type: string
      aws_region:
        description: AWS region for the stack
        required: false
        default: us-east-1
        type: string

jobs:
  glass-deploy:
    permissions:
      id-token: write
      contents: read
    uses: obscurelyme/glass/.github/workflows/deploy.yaml@v0.1.0
    with:
      role-to-assume: ${{ secrets.OIDC_IAM_ROLE }}
      aws-region: ${{ inputs.aws_region }}
      deployment-environment: default
      glass-command: >-
        cfn ${{ inputs.stack_action }} --infra-dir ./infrastructure
        --region ${{ inputs.aws_region }} --env default
    secrets:
      GLASS_TOKEN: ${{ secrets.GLASS_GH_PAT }}
